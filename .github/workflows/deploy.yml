name: Test and deploy 2048

on:
  pull_request:
  push:
    branches: [cloudfront-hosting]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 2048-production-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::211125602758:role/github-platform-actions-oidc
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
  TF_VAR_aws_region: us-east-1
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME || 'fozdigitalz.com' }}
  TF_VAR_enable_waf: ${{ vars.ENABLE_WAF || 'false' }}
  TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
  TF_VAR_subdomain: ${{ vars.SUBDOMAIN || 'play-2048' }}

jobs:
  quality:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Lambda dependencies
        run: npm ci --omit=dev
        working-directory: terraform/lambda

      - name: Run tests
        run: npm test

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Initialize Terraform without backend
        run: terraform init -backend=false
        working-directory: terraform

      - name: Validate Terraform
        run: terraform validate
        working-directory: terraform

  infrastructure:
    name: Plan and apply infrastructure
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      cloudfront_id: ${{ steps.outputs.outputs.cloudfront_id }}
      s3_bucket: ${{ steps.outputs.outputs.s3_bucket }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-2048-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Lambda production dependencies
        run: npm ci --omit=dev
        working-directory: terraform/lambda

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform

      - name: Plan Terraform changes
        run: terraform plan -out=tfplan
        working-directory: terraform

      - name: Apply saved plan
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Read deployment outputs
        id: outputs
        working-directory: terraform
        shell: bash
        run: |
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Publish static application
    needs: infrastructure
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-2048-assets-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create same-origin runtime configuration
        shell: bash
        run: printf '%s\n' "window.API_GATEWAY_URL = '/api';" > config.js

      - name: Assemble release artifact
        shell: bash
        run: |
          mkdir release
          cp \
            404.html \
            analytics.js \
            config.js \
            favicon.svg \
            index.html \
            manifest.webmanifest \
            privacy.html \
            pwa.js \
            script.js \
            service-worker.js \
            share-modal.css \
            style.css \
            release/

      - name: Publish release with conservative caching
        shell: bash
        run: |
          aws s3 sync release/ "s3://${{ needs.infrastructure.outputs.s3_bucket }}/" \
            --delete \
            --cache-control "no-cache,max-age=0,must-revalidate"

      - name: Apply longer caching to static assets
        shell: bash
        run: |
          aws s3 cp release/ "s3://${{ needs.infrastructure.outputs.s3_bucket }}/" \
            --recursive \
            --exclude "*" \
            --include "*.css" \
            --include "*.svg" \
            --include "manifest.webmanifest" \
            --cache-control "public,max-age=86400"

      - name: Invalidate changed CloudFront entry files
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ needs.infrastructure.outputs.cloudfront_id }}"
          --paths "/index.html" "/config.js" "/service-worker.js" "/privacy.html" "/404.html"
